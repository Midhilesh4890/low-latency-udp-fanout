name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end localhost smoke test
        run: ./scripts/smoke_test.sh ./build/bin

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DPULSEFANOUT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
